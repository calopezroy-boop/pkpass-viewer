<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>PKPass Viewer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #ffffff;

      background:
        radial-gradient(
          circle at top,
          #1f2937,
          #05070b 58%
        );
    }

    .container {
      width: min(520px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
    }

    .subtitle {
      margin: 0;
      color: #aeb7c6;
    }

    .upload-box {
      padding: 22px;
      margin: 24px 0;

      border: 1px solid #334155;
      border-radius: 20px;

      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(18px);
    }

    input {
      width: 100%;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 14px 18px;

      border: 0;
      border-radius: 14px;

      color: white;
      background: #1677ff;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.06);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    .error {
      display: none;

      padding: 14px;
      margin-bottom: 18px;

      border-radius: 12px;

      color: #fecaca;
      background: #450a0a;
    }

    /*
    |--------------------------------------------------------------------------
    | Browser Preview
    |--------------------------------------------------------------------------
    */

    .ticket {
      display: none;
      overflow: hidden;

      border-radius: 28px;

      background: #0d5db9;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45);
    }

    .ticket-header {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      min-height: 92px;
      padding: 20px 22px 16px;
    }

    .wallet-notch {
      position: absolute;
      top: -1px;
      left: 50%;
      width: 76px;
      height: 27px;
      border-radius: 0 0 38px 38px;
      background: #05070b;
      transform: translateX(-50%);
    }

    .ticket-header-left { max-width: 58%; }

    .ticket-header-fields {
      display: flex;
      gap: 16px;
      max-width: 42%;
      text-align: right;
    }

    .desktop-logo {
      display: none;

      width: auto;
      max-width: 190px;
      max-height: 52px;

      object-fit: contain;
      object-position: left center;
    }

    .organization-text {
      margin-bottom: 8px;

      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .ticket-artwork {
      display: none;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 150px;
      overflow: hidden;

      background: rgba(0, 0, 0, 0.18);
    }

    .ticket-artwork img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .ticket-body {
      padding: 16px 22px 24px;
    }

    .label {
      margin-bottom: 3px;

      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;

      opacity: 0.85;
    }

    .value {
      margin-bottom: 12px;
      font-size: 18px;
    }

    .primary-value { font-size: 24px; line-height: 1.15; }

    .wallet-field-row {
      display: grid;
      grid-template-columns: repeat(var(--field-count, 1), minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .wallet-field-group:empty { display: none; }

    .wallet-field { min-width: 0; }
    .wallet-field.align-center { text-align: center; }
    .wallet-field.align-right { text-align: right; }

    .wallet-field-value {
      overflow-wrap: anywhere;
      font-size: 20px;
      line-height: 1.15;
    }

    .ticket-header-fields .label { font-size: 9px; }
    .ticket-header-fields .wallet-field-value { font-size: 17px; }

    .seat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 14px;
      margin: 8px 0 20px;

      text-align: center;
    }

    .seat-value {
      font-size: 26px;
    }

    .qr-wrapper {
      width: min(230px, 72%);

      padding: 12px;
      margin: 16px auto 8px;

      border-radius: 16px;
      background: white;
    }

    .qr-wrapper img {
      display: block;
      width: 100%;
    }

    .barcode-number {
      overflow-wrap: anywhere;

      text-align: center;
      font-family: monospace;
      font-size: 14px;
    }

    @media (max-width: 440px) {
      body { padding: 18px 10px; }
      .ticket-header { min-height: 82px; padding: 17px 17px 13px; }
      .ticket-body { padding: 14px 17px 20px; }
      .ticket-artwork { height: 132px; }
      .wallet-field-row { gap: 9px; }
      .wallet-field-value { font-size: 18px; }
    }

    .download-area {
      display: none;
      margin-top: 18px;
    }

    #downloadTicketButton {
      background: #16a34a;
    }

    #downloadTicketButton:hover {
      background: #15803d;
    }

    .privacy-note {
      margin: 12px 4px 0;

      color: #94a3b8;

      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    /*
    |--------------------------------------------------------------------------
    | Hidden Mobile Export
    |--------------------------------------------------------------------------
    */

    .mobile-export {
      position: fixed;
      top: 0;
      left: -10000px;

      width: 390px;
      height: 844px;
      padding: 14px;

      color: white;
      background: #101318;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .mobile-pass {
      position: relative;

      display: flex;
      flex-direction: column;

      width: 100%;
      height: 816px;
      overflow: hidden;

      border-radius: 28px;
      background: #0d5db9;

      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.35);
    }

    .mobile-header {
      position: relative;

      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      min-height: 115px;
      padding: 22px;

      background: rgba(255, 255, 255, 0.08);
    }

    .mobile-notch {
      position: absolute;
      top: -1px;
      left: 50%;

      width: 70px;
      height: 31px;

      border-radius: 0 0 36px 36px;

      background: #101318;
      transform: translateX(-50%);
    }

    .mobile-header-left {
      max-width: 55%;
      padding-top: 5px;
    }

    .mobile-logo {
      display: none;

      width: auto;
      max-width: 150px;
      max-height: 48px;

      object-fit: contain;
      object-position: left center;
    }

    .mobile-organization {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.07em;
    }

    .mobile-header-right {
      padding-top: 5px;
      text-align: right;
    }

    .mobile-time {
      margin-bottom: 3px;

      font-size: 15px;
      font-weight: 600;
    }

    .mobile-date {
      font-size: 23px;
      line-height: 1.1;
    }

    .mobile-artwork {
      display: none;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 155px;
      overflow: hidden;

      background: rgba(0, 0, 0, 0.18);
    }

    .mobile-artwork img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
    }

    .mobile-body {
      display: flex;
      flex: 1;
      flex-direction: column;

      padding: 18px 22px;
    }

    .mobile-label {
      margin-bottom: 4px;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.09em;

      opacity: 0.85;
    }

    .mobile-value {
      margin-bottom: 15px;

      font-size: 18px;
      line-height: 1.25;
    }

    .mobile-event {
      font-size: 17px;
      font-weight: 500;
    }

    .mobile-venue {
      font-size: 20px;
    }

    .mobile-seat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 10px;
      margin: 2px 0 16px;

      text-align: center;
    }

    .mobile-seat-value {
      font-size: 27px;
      font-weight: 500;
    }

    .mobile-qr-section {
      margin-top: auto;
      text-align: center;
    }

    .mobile-qr-wrapper {
      width: 245px;

      padding: 16px;
      margin: 0 auto 10px;

      border-radius: 12px;
      background: white;
    }

    .mobile-qr-wrapper img {
      display: block;
      width: 100%;
    }

    .mobile-barcode-number {
      padding-bottom: 2px;

      overflow-wrap: anywhere;

      font-family: monospace;
      font-size: 10px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>PKPass Viewer</h1>

    <p class="subtitle">
      Upload your own Apple Wallet ticket.
    </p>

    <section class="upload-box">
      <input
        id="pkpassFile"
        type="file"
        accept=".pkpass"
      />

      <button id="analyzeButton">
        Analyze PKPass
      </button>
    </section>

    <div
      id="errorBox"
      class="error"
    ></div>

    <article
      id="ticketCard"
      class="ticket"
    >
      <header class="ticket-header">
        <div class="wallet-notch"></div>

        <div class="ticket-header-left">
          <img
            id="desktopLogo"
            class="desktop-logo"
            alt="Ticket provider logo"
          />

          <div
            id="organizationLabel"
            class="organization-text"
          >TICKET</div>
        </div>

        <div
          id="desktopHeaderFields"
          class="ticket-header-fields"
        ></div>
      </header>

      <div
        id="desktopArtwork"
        class="ticket-artwork"
      >
        <img
          id="desktopArtworkImage"
          alt="Ticket artwork"
        />
      </div>

      <div class="ticket-body">
        <div
          id="desktopPrimaryFields"
        ></div>

        <div
          id="desktopSecondaryFields"
        ></div>

        <div id="desktopAuxiliaryFields"></div>

        <div class="qr-wrapper">
          <img
            id="qrImage"
            alt="Ticket barcode"
          />
        </div>

        <div
          id="barcodeNumber"
          class="barcode-number"
        ></div>
      </div>
    </article>

    <section
      id="downloadArea"
      class="download-area"
    >
      <button id="downloadTicketButton">
        Download Mobile Ticket
      </button>

      <p class="privacy-note">
        The downloaded image contains a live ticket
        barcode. Keep it private and share it only with
        authorized team members.
      </p>
    </section>
  </main>

  <section
    id="mobileExport"
    class="mobile-export"
    aria-hidden="true"
  >
    <article
      id="mobilePass"
      class="mobile-pass"
    >
      <header class="mobile-header">
        <div class="mobile-notch"></div>

        <div class="mobile-header-left">
          <img
            id="mobileLogo"
            class="mobile-logo"
            alt="Ticket provider logo"
          />

          <div
            id="mobileOrganization"
            class="mobile-organization"
          >
            TICKET
          </div>
        </div>

        <div class="mobile-header-right">
          <div
            id="mobileTime"
            class="mobile-time"
          ></div>

          <div
            id="mobileDate"
            class="mobile-date"
          ></div>
        </div>
      </header>

      <div
        id="mobileArtwork"
        class="mobile-artwork"
      >
        <img
          id="mobileArtworkImage"
          alt="Ticket artwork"
        />
      </div>

      <div class="mobile-body">
        <div class="mobile-label">
          EVENT
        </div>

        <div
          id="mobileEvent"
          class="mobile-value mobile-event"
        ></div>

        <div class="mobile-label">
          VENUE
        </div>

        <div
          id="mobileVenue"
          class="mobile-value mobile-venue"
        ></div>

        <div class="mobile-seat-grid">
          <div>
            <div class="mobile-label">
              SECTION
            </div>

            <div
              id="mobileSection"
              class="mobile-seat-value"
            ></div>
          </div>

          <div>
            <div class="mobile-label">
              ROW
            </div>

            <div
              id="mobileRow"
              class="mobile-seat-value"
            ></div>
          </div>

          <div>
            <div class="mobile-label">
              SEAT
            </div>

            <div
              id="mobileSeat"
              class="mobile-seat-value"
            ></div>
          </div>
        </div>

        <div class="mobile-qr-section">
          <div class="mobile-qr-wrapper">
            <img
              id="mobileQrImage"
              alt="Ticket barcode"
            />
          </div>

          <div
            id="mobileBarcodeNumber"
            class="mobile-barcode-number"
          ></div>
        </div>
      </div>
    </article>
  </section>

  <script
    src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
  ></script>

  <script>
    const fileInput =
      document.getElementById("pkpassFile");

    const analyzeButton =
      document.getElementById("analyzeButton");

    const ticketCard =
      document.getElementById("ticketCard");

    const downloadArea =
      document.getElementById("downloadArea");

    const downloadTicketButton =
      document.getElementById(
        "downloadTicketButton"
      );

    const errorBox =
      document.getElementById("errorBox");

    const qrImage =
      document.getElementById("qrImage");

    const mobileQrImage =
      document.getElementById(
        "mobileQrImage"
      );

    let currentPassData = null;

    analyzeButton.addEventListener(
      "click",
      analyzePkpass
    );

    downloadTicketButton.addEventListener(
      "click",
      downloadMobileTicket
    );

    async function analyzePkpass() {
      const file = fileInput.files[0];

      hideError();

      ticketCard.style.display = "none";
      downloadArea.style.display = "none";

      if (!file) {
        showError(
          "Please select a .pkpass file."
        );

        return;
      }

      if (
        !file.name
          .toLowerCase()
          .endsWith(".pkpass")
      ) {
        showError(
          "Please upload a valid .pkpass file."
        );

        return;
      }

      const formData = new FormData();

      formData.append("pkpass", file);

      analyzeButton.disabled = true;
      analyzeButton.textContent =
        "Analyzing...";

      try {
        const response = await fetch(
          "/analyze-pkpass",
          {
            method: "POST",
            body: formData,
          }
        );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "Unable to analyze the file."
          );
        }

        currentPassData = data;

        populatePreview(data);
        populateMobileExport(data);
        applyPassDesign(data);

        qrImage.src =
          data.qrDataUrl;

        mobileQrImage.src =
          data.qrDataUrl;

        await waitForRequiredImages();

        ticketCard.style.display =
          "block";

        downloadArea.style.display =
          "block";
      } catch (error) {
        console.error(error);

        showError(
          error instanceof Error
            ? error.message
            : "Unable to analyze the ticket."
        );
      } finally {
        analyzeButton.disabled = false;
        analyzeButton.textContent =
          "Analyze PKPass";
      }
    }

    function populatePreview(data) {
      setText(
        "organizationLabel",
        data.logoText ||
        data.organization ||
        data.description ||
        "TICKET"
      );

      renderFieldRow(
        "desktopHeaderFields",
        data.fields?.header || []
      );

      renderFieldRow(
        "desktopPrimaryFields",
        data.fields?.primary?.length
          ? data.fields.primary
          : [{ label: "EVENT", value: data.event || "Event" }],
        "primary-value"
      );

      renderFieldRow(
        "desktopSecondaryFields",
        data.fields
          ? data.fields.secondary || []
          : [{ label: "VENUE", value: data.venue || "—" }]
      );

      renderFieldRow(
        "desktopAuxiliaryFields",
        data.fields?.auxiliary?.length
          ? data.fields.auxiliary
          : [
              { label: "SECTION", value: data.section || "—" },
              { label: "ROW", value: data.row || "—" },
              { label: "SEAT", value: data.seat || "—" },
            ]
      );

      setText(
        "barcodeNumber",
        data.barcodeMessage || ""
      );
    }

    function renderFieldRow(elementId, fields, valueClass = "") {
      const group = document.getElementById(elementId);
      group.replaceChildren();
      group.className = "wallet-field-group";

      for (let start = 0; start < fields.length; start += 3) {
        const chunk = fields.slice(start, start + 3);
        const row = document.createElement("div");
        row.className = "wallet-field-row";
        row.style.setProperty("--field-count", chunk.length);

        chunk.forEach((field) => {
          const item = document.createElement("div");
          item.className = `wallet-field ${getAlignmentClass(field.textAlignment)}`;

          const label = document.createElement("div");
          label.className = "label";
          label.textContent = field.label || "";

          const value = document.createElement("div");
          value.className = `wallet-field-value ${valueClass}`.trim();
          value.textContent = formatFieldValue(field.value);

          item.append(label, value);
          row.append(item);
        });

        group.append(row);
      }
    }

    function getAlignmentClass(alignment = "") {
      if (alignment.includes("Center")) return "align-center";
      if (alignment.includes("Right")) return "align-right";
      return "";
    }

    function formatFieldValue(value) {
      if (value === null || value === undefined || value === "") return "—";
      return String(value);
    }

    function populateMobileExport(data) {
      setText(
        "mobileOrganization",
        data.logoText ||
        data.organization ||
        data.description ||
        "TICKET"
      );

      setText(
        "mobileTime",
        data.time || ""
      );

      setText(
        "mobileDate",
        data.date || ""
      );

      setText(
        "mobileEvent",
        data.event || "Event"
      );

      setText(
        "mobileVenue",
        data.venue || "—"
      );

      setText(
        "mobileSection",
        data.section || "—"
      );

      setText(
        "mobileRow",
        data.row || "—"
      );

      setText(
        "mobileSeat",
        data.seat || "—"
      );

      setText(
        "mobileBarcodeNumber",
        data.barcodeMessage || ""
      );
    }

    function applyPassDesign(data) {
      const backgroundColor =
        data.backgroundColor ||
        "#0d5db9";

      const foregroundColor =
        data.foregroundColor ||
        "#ffffff";

      const labelColor =
        data.labelColor ||
        foregroundColor;

      ticketCard.style.background =
        backgroundColor;

      ticketCard.style.color =
        foregroundColor;

      const mobilePass =
        document.getElementById(
          "mobilePass"
        );

      mobilePass.style.background =
        backgroundColor;

      mobilePass.style.color =
        foregroundColor;

      document
        .querySelectorAll(
          ".label, .mobile-label"
        )
        .forEach((label) => {
          label.style.color =
            labelColor;
        });

      applyLogo(data);
      applyArtwork(data);
    }

    function applyLogo(data) {
      const desktopLogo =
        document.getElementById(
          "desktopLogo"
        );

      const mobileLogo =
        document.getElementById(
          "mobileLogo"
        );

      const desktopText =
        document.getElementById(
          "organizationLabel"
        );

      const mobileText =
        document.getElementById(
          "mobileOrganization"
        );

      if (data.logoImage) {
        desktopLogo.src =
          data.logoImage;

        mobileLogo.src =
          data.logoImage;

        desktopLogo.style.display =
          "block";

        mobileLogo.style.display =
          "block";

        desktopText.style.display =
          "none";

        mobileText.style.display =
          "none";
      } else {
        desktopLogo.removeAttribute(
          "src"
        );

        mobileLogo.removeAttribute(
          "src"
        );

        desktopLogo.style.display =
          "none";

        mobileLogo.style.display =
          "none";

        desktopText.style.display =
          "block";

        mobileText.style.display =
          "block";
      }
    }

    function applyArtwork(data) {
      const artworkSource =
        data.stripImage ||
        data.backgroundImage ||
        data.thumbnailImage ||
        data.iconImage ||
        "";

      const desktopArtwork =
        document.getElementById(
          "desktopArtwork"
        );

      const desktopArtworkImage =
        document.getElementById(
          "desktopArtworkImage"
        );

      const mobileArtwork =
        document.getElementById(
          "mobileArtwork"
        );

      const mobileArtworkImage =
        document.getElementById(
          "mobileArtworkImage"
        );

      if (artworkSource) {
        desktopArtworkImage.src =
          artworkSource;

        mobileArtworkImage.src =
          artworkSource;

        desktopArtworkImage.style.display =
          "block";

        mobileArtworkImage.style.display =
          "block";

        desktopArtwork.style.display =
          "flex";

        mobileArtwork.style.display =
          "flex";
      } else {
        desktopArtworkImage.removeAttribute(
          "src"
        );

        mobileArtworkImage.removeAttribute(
          "src"
        );

        desktopArtwork.style.display =
          "none";

        mobileArtwork.style.display =
          "none";
      }
    }

    async function waitForRequiredImages() {
      const images = [
        qrImage,
        mobileQrImage,
        document.getElementById(
          "desktopLogo"
        ),
        document.getElementById(
          "mobileLogo"
        ),
        document.getElementById(
          "desktopArtworkImage"
        ),
        document.getElementById(
          "mobileArtworkImage"
        ),
      ];

      const activeImages =
        images.filter((image) => {
          return (
            image &&
            image.getAttribute("src")
          );
        });

      await Promise.all(
        activeImages.map(waitForImage)
      );
    }

    async function downloadMobileTicket() {
      if (!currentPassData) {
        showError(
          "Analyze a PKPass before downloading."
        );

        return;
      }

      hideError();

      downloadTicketButton.disabled =
        true;

      downloadTicketButton.textContent =
        "Preparing Mobile Ticket...";

      try {
        populateMobileExport(
          currentPassData
        );

        applyPassDesign(
          currentPassData
        );

        mobileQrImage.src =
          currentPassData.qrDataUrl;

        await waitForRequiredImages();

        const mobileExport =
          document.getElementById(
            "mobileExport"
          );

        const canvas =
          await html2canvas(
            mobileExport,
            {
              scale: 3,
              width: 390,
              height: 844,
              windowWidth: 390,
              windowHeight: 844,
              backgroundColor: "#101318",
              useCORS: true,
              logging: false,
            }
          );

        const imageBlob =
          await canvasToBlob(canvas);

        const imageUrl =
          URL.createObjectURL(
            imageBlob
          );

        const downloadLink =
          document.createElement("a");

        downloadLink.href =
          imageUrl;

        downloadLink.download =
          createTicketFilename();

        document.body.appendChild(
          downloadLink
        );

        downloadLink.click();
        downloadLink.remove();

        setTimeout(() => {
          URL.revokeObjectURL(
            imageUrl
          );
        }, 1000);
      } catch (error) {
        console.error(error);

        showError(
          "Unable to download the mobile ticket image."
        );
      } finally {
        downloadTicketButton.disabled =
          false;

        downloadTicketButton.textContent =
          "Download Mobile Ticket";
      }
    }

    function waitForImage(image) {
      if (
        image.complete &&
        image.naturalWidth > 0
      ) {
        return Promise.resolve();
      }

      return new Promise(
        (resolve, reject) => {
          image.addEventListener(
            "load",
            resolve,
            {
              once: true,
            }
          );

          image.addEventListener(
            "error",
            () => {
              reject(
                new Error(
                  "A ticket image failed to load."
                )
              );
            },
            {
              once: true,
            }
          );
        }
      );
    }

    function canvasToBlob(canvas) {
      return new Promise(
        (resolve, reject) => {
          canvas.toBlob(
            (blob) => {
              if (blob) {
                resolve(blob);
              } else {
                reject(
                  new Error(
                    "Unable to generate the image."
                  )
                );
              }
            },
            "image/png",
            1
          );
        }
      );
    }

    function createTicketFilename() {
      const event = currentPassData?.event || "ticket";

      const section =
        currentPassData?.section || "";

      const row =
        currentPassData?.row || "";

      const seat =
        currentPassData?.seat || "";

      const parts = [
        event,

        section &&
        section !== "—"
          ? `section-${section}`
          : "",

        row &&
        row !== "—"
          ? `row-${row}`
          : "",

        seat &&
        seat !== "—"
          ? `seat-${seat}`
          : "",
      ].filter(Boolean);

      const safeName =
        parts
          .join("-")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");

      return `${
        safeName || "ticket"
      }.png`;
    }

    function setText(elementId, value) {
      const element =
        document.getElementById(
          elementId
        );

      if (element) {
        element.textContent =
          String(value ?? "");
      }
    }

    function getText(elementId) {
      return (
        document
          .getElementById(elementId)
          ?.textContent
          ?.trim() || ""
      );
    }

    function showError(message) {
      errorBox.textContent =
        message;

      errorBox.style.display =
        "block";
    }

    function hideError() {
      errorBox.textContent = "";
      errorBox.style.display =
        "none";
    }
  </script>
</body>
</html>
